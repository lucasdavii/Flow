<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Entrar na sala | FlowRoom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/flowroom.css" />
  </head>
  <body>
    <div class="ambient-bg" aria-hidden="true">
      <span class="ambient-orb pink"></span>
      <span class="ambient-orb yellow"></span>
      <span class="ambient-orb teal"></span>
      <span class="ambient-glass one"></span>
      <span class="ambient-glass two"></span>
      <span class="ambient-ring" style="height: 220px; width: 220px; right: -40px; top: 42%"></span>
      <svg class="ambient-sparkle a" viewBox="0 0 24 24" fill="none">
        <path
          d="M12 2c.7 4.6 3 6.9 7.6 7.6-4.6.7-6.9 3-7.6 7.6-.7-4.6-3-6.9-7.6-7.6C9 8.9 11.3 6.6 12 2Z"
          fill="currentColor"
        />
      </svg>
      <svg class="ambient-sparkle b" viewBox="0 0 24 24" fill="none">
        <path
          d="M12 2c.7 4.6 3 6.9 7.6 7.6-4.6.7-6.9 3-7.6 7.6-.7-4.6-3-6.9-7.6-7.6C9 8.9 11.3 6.6 12 2Z"
          fill="currentColor"
        />
      </svg>
      <svg class="ambient-sparkle c" viewBox="0 0 24 24" fill="none">
        <path
          d="M12 2c.7 4.6 3 6.9 7.6 7.6-4.6.7-6.9 3-7.6 7.6-.7-4.6-3-6.9-7.6-7.6C9 8.9 11.3 6.6 12 2Z"
          fill="currentColor"
        />
      </svg>
      <div class="ambient-dust">
        <i style="left: 10%; top: 20%; width: 4px; height: 4px; animation-delay: -0.5s"></i>
        <i style="left: 30%; top: 70%; width: 3px; height: 3px; animation-delay: -1.5s"></i>
        <i style="left: 60%; top: 15%; width: 5px; height: 5px; animation-delay: -2.5s"></i>
        <i style="left: 80%; top: 55%; width: 3px; height: 3px; animation-delay: -3.5s"></i>
        <i style="left: 45%; top: 85%; width: 4px; height: 4px; animation-delay: -4s"></i>
        <i style="left: 20%; top: 45%; width: 3px; height: 3px; animation-delay: -1s"></i>
      </div>
    </div>
    <header class="site-header">
      <a class="brand" href="../index.html"></a>
      <nav class="top-links"><a href="login.html">Professor</a><a href="demo.html">Demo</a></nav>
    </header>
    <main class="page">
      <div class="hero-split">
        <section class="hero">
          <span class="eyebrow">Entrada do aluno</span>
          <h1>Entre na atividade.</h1>
          <p>Sem cadastro, senha ou perfil. Só o código que o professor compartilhou.</p>
        </section>
        <div class="hero-art" style="--blob: var(--yellow)">
          <img
            src="../img/DUB-DUB_ai_AI_Transcription-removebg-preview.png"
            alt="Livro aberto com balões de fala, representando a atividade que o aluno vai receber"
          />
        </div>
      </div>
      <form class="form-card" id="joinForm">
        <div class="field">
          <label for="code">Código da sala</label><input id="code" maxlength="5" placeholder="Ex.: K7P2X" required />
        </div>
        <div class="field">
          <label for="name">Seu nome</label><input id="name" placeholder="Como podemos chamar você?" required />
        </div>
        <p class="hint" id="joinError" role="alert" style="display: none; color: var(--coral); font-weight: 700"></p>
        <div class="actions"><button class="btn" id="joinButton">Entrar na sala →</button></div>
        <p class="hint">Você receberá uma função. A resposta completa nasce do grupo.</p>
      </form>
    </main>
    <footer class="footer">FlowRoom · a função certa para a pessoa certa.</footer>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/flowroom.js"></script>
    <script>
      const joinForm = document.querySelector("#joinForm");
      const joinError = document.querySelector("#joinError");
      const joinButton = document.querySelector("#joinButton");

      joinForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        joinError.style.display = "none";
        const code = document.querySelector("#code").value.trim().toUpperCase();
        const name = document.querySelector("#name").value.trim();
        if (!code || !name) return;

        joinButton.disabled = true;
        joinButton.textContent = "Entrando...";

        const result = await FlowAPI.joinSession(code, name);

        if (!result.ok) {
          joinError.textContent = FlowAPI.describeError(result);
          joinError.style.display = "block";
          joinButton.disabled = false;
          joinButton.textContent = "Entrar na sala →";
          return;
        }

        const { participant, participant_token } = result.data;
        FlowAPI.tokens.setParticipant(code, participant_token);
        sessionStorage.setItem("flowroom_active_participant_name", participant.name);
        window.location.href = "sala.html?code=" + code + "&role=student";
      });
    </script>
  </body>
</html>
