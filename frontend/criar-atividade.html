<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar atividade | FlowRoom</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/flowroom.css"></head><body><header class="site-header"><a class="brand" href="index.htm"><i class="brand-mark"></i><span>FLOWROOM</span></a><nav class="top-links"><a href="professor.htm">Professor</a><a href="sala.htm">Sala</a></nav></header><main class="page"><section class="hero"><span class="eyebrow">Nova atividade</span><h1>Dê uma intenção para a aula.</h1><p>Uma atividade FlowRoom alterna momentos digitais e presenciais para fazer cada etapa ter uma função clara.</p></section><form class="form-card" data-next="sala.htm"><div class="field"><label for="title">Título da atividade</label><input id="title" placeholder="Ex.: Quem evitou o conflito?" required></div><div class="field"><label for="subject">Área e turma</label><input id="subject" placeholder="Ex.: História · 9º ano" required></div><div class="field"><label for="groups">Tamanho dos grupos</label><select id="groups"><option>4 alunos</option><option>3 alunos</option><option>5 alunos</option></select></div><div class="field"><label for="stages">Etapas</label><textarea id="stages" placeholder="1. Investigar · Digital\n2. Confrontar · Presencial\n3. Concluir · Digital" required></textarea></div><div class="actions"><button class="btn">Criar atividade e abrir sala →</button></div></form></main><footer class="footer">O FlowRoom organiza quando o smartphone merece estar na aula.</footer><script src="js/flowroom.js"></script></body></html>
